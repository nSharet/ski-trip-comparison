<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>כריסמס בבוקרשט 2026/27</title><style>
:root{font-family:system-ui,Arial;color-scheme:dark}body{margin:0;background:#101b2a;color:#f3f6fa}main{max-width:1000px;margin:auto;padding:20px}header{padding:24px 0}h1{font-size:clamp(27px,5vw,44px);margin:0 0 12px}p{line-height:1.7;color:#d4deea}.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:22px 0}.days button{background:#23364c;color:white;border:1px solid #52677d;border-radius:15px;padding:14px 5px;cursor:pointer;font-size:15px}.days button.active{background:#1c796e;border-color:#91e9d1}.days b{display:block;font-size:23px}.panel{background:#192a3d;border:1px solid #354d66;border-radius:18px;padding:20px;margin:16px 0}h2{margin-top:0}li{margin:12px 0;line-height:1.6}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.place{background:#22364d;padding:14px;border-radius:12px}.place p{margin:5px 0}.place a,a{color:#9fe5ff}.muted{color:#b3c4d5;font-size:14px}.map{width:100%;height:390px;border:0;border-radius:14px;background:#fff}button.mark{background:#314d62;color:#fff;border:1px solid #658398;border-radius:8px;padding:7px 11px;cursor:pointer}.mark.done{background:#176b56}.warning{font-size:13px;color:#f5d79a}@media(max-width:620px){main{padding:12px}.days{gap:5px}.days button{font-size:12px;padding:10px 2px}.days b{font-size:19px}.panel{padding:14px}}</style></head><body><main><header><h1>🎄 כריסמס בבוקרשט 2026/27</h1><p>חמישה ימים של אורות חג, שווקי כריסמס, שדרות יפות, קניות ואוכל מקומי. בוחרים תאריך ורואים את המסלול, העצירות והאפשרויות לאותו יום — הכול במקום אחד, מותאם לנייד.</p></header><nav id="days" class="days" aria-label="בחירת יום"></nav><div id="content"></div></main><script>
const days=[
{date:"1.12",title:"הגעה, העיר העתיקה ושוק הכריסמס",intro:"מתמקמים במלון, יוצאים להליכה נעימה במרכז ומסיימים בשוק הכריסמס בכיכר החוקה.",stops:[["14:00–16:00","הגעה למלון Park Inn, צ'ק־אין ומנוחה"],["16:00–18:00","הליכה דרך Calea Victoriei והעיר העתיקה, עם עצירת קפה וקינוח"],["18:00–20:00","שוק הכריסמס המרכזי ב־Piața Constituției"],["20:00–21:30","ארוחת ערב — בחירה מבין שתי חלופות"],["21:30–22:30","חזרה למלון ברגל או בשני רכבי Bolt"]],places:[["🍰 קינוח","Casa Capșa","קונדיטוריה היסטורית וקינוחים קלאסיים; דירוג טעון אימות (הוזכר 4.3 ולכן אינו עומד כרגע בסף 4.4)","Calea Victoriei 36, Bucharest"],["🍰 קינוח","קונדיטוריה נוספת לאורך Calea Victoriei","חלופה תיבחר לאחר אימות שם, דירוג ושעות פתיחה","Calea Victoriei, Bucharest"],["🍽️ ערב","Curtea Berarilor","אוכל רומני ובירה בעיר העתיקה; מומלץ להזמין שולחן לשמונה. דירוג ומחירים בבדיקה","Strada Șelari 9-11, Bucharest"],["🍽️ ערב","Hanu' Berarilor","אוכל רומני מסורתי; יש לאמת סניף, דירוג, מחיר ושעות פתיחה","Bucharest, Romania"]],map:"Park Inn by Radisson Bucharest Hotel & Residence, Strada Luterană 2-4, Bucharest, Romania",destination:"Piața Constituției, Bucharest, Romania"},
{date:"2.12",title:"שדרות ויקטוריה והמרכז ההיסטורי",intro:"יום של ארכיטקטורה, בתי קפה, בוטיקים והאורות של מרכז העיר.",stops:[["10:30–13:30","Calea Victoriei, כיכר המהפכה והאתנאום הרומני"],["13:30–15:00","ארוחת צהריים"],["15:00–18:00","חנויות, רחובות צדדיים ועצירות קפה"],["18:00–21:30","אורות ערב וארוחת ערב"],["22:00–23:00","חזרה למלון"]],places:[],destination:"Romanian Athenaeum, Bucharest, Romania"},
{date:"3.12",title:"AFI Cotroceni ושוק West Side",intro:"קניות בפריימרק ובקניון, ואחריהן שוק כריסמס מערבי בפארק.",stops:[["10:30–11:00","יציאה מהמלון"],["11:00–15:00","AFI Cotroceni ו־Primark"],["16:30–21:30","West Side Christmas Market בפארק Drumul Taberei"],["22:00–23:00","חזרה למלון"]],places:[],destination:"Drumul Taberei Park, Bucharest, Romania"},
{date:"4.12",title:"קניות, קינוחים וערב חגיגי",intro:"יום גמיש של קניות, בתי קפה ושוק חג אהוב.",stops:[["10:30–11:00","יציאה מהמלון"],["11:00–15:00","ParkLake או אאוטלט — בחירה בהמשך"],["15:00–17:00","אפשרות לשוק ילדים ליד האופרה, בכפוף לאימות פעילות"],["18:00–21:30","שוק כריסמס או ערב במרכז העיר"],["22:00–23:00","חזרה למלון"]],places:[],destination:"ParkLake Shopping Center, Bucharest, Romania"},
{date:"5.12",title:"חזרה הביתה",intro:"בוקר קצר ונסיעה לשדה התעופה.",stops:[["08:00–08:15","יציאה מהמלון"],["סביב 09:00","הגעה מתוכננת לשדה התעופה"],["12:00","טיסה"]],places:[],destination:"Henri Coandă International Airport, Otopeni, Romania"}];
const hotel="Park Inn by Radisson Bucharest Hotel & Residence, Strada Luterană 2-4, Bucharest, Romania";
const maps=(s,d)=>"https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(s)+"&destination="+encodeURIComponent(d)+"&travelmode=walking";
const key=(d,i)=>"bucharest-2026-"+d+"-"+i;
function render(i){const d=days[i];document.querySelectorAll("#days button").forEach((b,j)=>{b.classList.toggle("active",i===j);b.setAttribute("aria-pressed",String(i===j))});const options=d.places.length?'<section class="panel"><h2>🍰 עצירות מתוקות ומסעדות</h2><div class="options">'+d.places.map((p,j)=>'<article class="place"><div class="muted">'+p[0]+'</div><h3>'+p[1]+'</h3><p>'+p[2]+'</p><p class="muted">'+p[3]+'</p><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p[3])+'">📍 מיקום במפה</a><p><button class="mark" data-key="'+key(i,j+100)+'"></button></p></article>').join("")+'</div><p class="warning">הבחירות והדירוגים טרם אומתו סופית. לא בוצעה הזמנה.</p></section>': '<section class="panel"><h2>🍰 אוכל וקינוחים</h2><p>שתי מסעדות ושתי עצירות מתוקות יתווספו לאחר בדיקת דירוגים, מחירים ומיקום לאורך המסלול.</p></section>';document.getElementById("content").innerHTML='<section class="panel"><h2>'+d.date+' — '+d.title+'</h2><p>'+d.intro+'</p><ol>'+d.stops.map((s,j)=>'<li><strong>'+s[0]+'</strong> — '+s[1]+' <button class="mark" data-key="'+key(i,j)+'"></button></li>').join("")+'</ol></section>'+options+'<section class="panel"><h2>🗺️ מפת היום</h2><p>מפת התמצאות וניווט בין נקודת המוצא ליעד המרכזי. מסלול מפורט עם כל התחנות יתווסף בהמשך.</p><iframe class="map" loading="lazy" title="מפת היום" src="https://maps.google.com/maps?q='+encodeURIComponent(d.destination)+'&output=embed"></iframe><p><a target="_blank" rel="noopener" href="'+maps(hotel,d.destination)+'">פתיחת ניווט בגוגל מפות</a></p></section>';document.querySelectorAll(".mark").forEach(b=>{const k=b.dataset.key;const update=()=>{const done=localStorage.getItem(k)==="1";b.textContent=done?"✓ היינו":"○ עוד לא היינו";b.classList.toggle("done",done)};update();b.onclick=()=>{localStorage.setItem(k,localStorage.getItem(k)==="1"?"0":"1");update()}})}
const nav=document.getElementById("days");days.forEach((d,i)=>{const b=document.createElement("button");b.innerHTML='<b>'+d.date+'</b><span>'+["שלישי","רביעי","חמישי","שישי","שבת"][i]+'</span>';b.onclick=()=>{render(i);history.replaceState(null,"","#day-"+(i+1))};nav.appendChild(b)});const selected=Math.max(0,Math.min(4,(Number(location.hash.replace("#day-",""))||1)-1));render(selected);
</script></body></html>
